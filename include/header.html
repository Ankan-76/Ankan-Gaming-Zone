<script>
    (function () {
        // Dynamically compute the path back to the root based on styling path
        var styleLink = document.querySelector('link[href$="CSS/style.css"]');
        var basePath = styleLink ? styleLink.getAttribute("href").replace("CSS/style.css", "") : "";

        // Update all relative links/images inside the header container
        $('#header-placeholder a:not([href^="http"]):not([href^="#"])').each(function () {
            var href = $(this).attr('href');
            if (href && !href.startsWith(basePath)) {
                $(this).attr('href', basePath + href);
            }
        });

        $('#header-placeholder img:not([src^="http"])').each(function () {
            var src = $(this).attr('src');
            if (src && !src.startsWith(basePath)) {
                $(this).attr('src', basePath + src);
            }
        });
    })();
</script>
