<script>
    (function () {
        // Dynamically compute the path back to the root based on styling path
        var styleLink = document.querySelector('link[href$="CSS/style.css"]');
        var basePath = styleLink ? styleLink.getAttribute("href").replace("CSS/style.css", "") : "";

        // Update all relative links/images inside the footer container
        $('#footer-placeholder a:not([href^="http"]):not([href^="#"])').each(function () {
            var href = $(this).attr('href');
            if (href && !href.startsWith(basePath)) {
                $(this).attr('href', basePath + href);
            }
        });

        $('#footer-placeholder img:not([src^="http"])').each(function () {
            var src = $(this).attr('src');
            if (src && !src.startsWith(basePath)) {
                $(this).attr('src', basePath + src);
            }
        });

        // Inject JS dynamically to avoid breaking nested structures
        if ($('script[src$="JS/script.js"]').length === 0) {
            var s = document.createElement('script');
            s.src = basePath + 'JS/script.js';
            document.body.appendChild(s);
        }

        if ($('script[src*="bootstrap.bundle.min.js"]').length === 0) {
            var b = document.createElement('script');
            b.src = 'https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js';
            document.body.appendChild(b);
        }

        // Apply specific logic for nested game pages
        if (basePath !== "") {
            const checkHeader = setInterval(() => {
                if ($('#mainNav').length) {
                    clearInterval(checkHeader);
                    $('.nav-link').removeClass('active');
                    $('.nav-link[href="' + basePath + 'games.html"]').addClass('active');
                    const navbar = document.getElementById('mainNav');
                    if (navbar) {
                        window.addEventListener('scroll', () => navbar.classList.toggle('scrolled', window.scrollY > 50));
                    }
                }
            }, 100);
        }
    })();
</script>
